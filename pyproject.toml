[project]
name = "netzwerkscanner"
version = "1.0.0.dev0"
description = "Inventar, Netzwerkkarte und Überwachung für das Heimnetz"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
    "windows: nur unter Windows sinnvoll",
    "slow: dauert mehrere Sekunden",
]
filterwarnings = [
    "ignore::DeprecationWarning:scapy.*",
]
